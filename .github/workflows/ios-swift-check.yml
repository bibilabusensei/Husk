name: Husk real iOS Swift SDK check
on:
  push:
    branches: [codex/jit-sdk-check]
  workflow_call:
    inputs:
      xcode_path:
        description: Optional installed Xcode.app path
        type: string
        required: false
        default: ''
  workflow_dispatch:
    inputs:
      xcode_path:
        description: Optional installed Xcode.app path; empty selects newest stable Xcode
        type: string
        required: false

permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: husk-ios-swift-sdk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ios-swift-typecheck:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      XCODE_PATH: ${{ inputs.xcode_path }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Select real Xcode toolchain
        run: |
          mkdir -p artifacts/ios-swift-check
          bash scripts/select-xcode.sh 2>&1 | tee artifacts/ios-swift-check/xcode-selection.log
      - name: Typecheck complete production App and both extensions with iPhoneOS SDK
        run: bash scripts/typecheck-ios.sh "$GITHUB_WORKSPACE" 2>&1 | tee artifacts/ios-swift-check/full-check.log
      - name: Upload actual source manifests and all typecheck logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: actual-ios-swift-typecheck
          path: |
            artifacts/ios-swift-check/*.log
            artifacts/ios-swift-check/*.txt
            artifacts/ios-swift-check/*.tsv
            artifacts/ios-swift-check/*-sources.json
          if-no-files-found: warn
          retention-days: 30
